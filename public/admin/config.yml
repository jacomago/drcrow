backend:
  name: git-gateway
  branch: master # or master, depending on your repo

media_folder: "public/assets/images" # Folder where media files will be stored
public_folder: "/assets/images" # The src attribute for uploaded media will begin with this path

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/pages/about.md"
        label: "About Page"
        name: "about"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/contact.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/exposition.md"
        label: "Exposition Page"
        name: "exposition"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/gallery.md"
        label: "Gallery Page"
        name: "gallery"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/index.md"
        label: "Home Page"
        name: "index"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "../layouts/Home.astro"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Tagline", name: "hero_tagline", widget: "string"}
          - {label: "Hero CTA Link", name: "hero_cta_link", widget: "string"}
          - {label: "Hero CTA Text", name: "hero_cta_text", widget: "string"}
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/media.md"
        label: "Media Page"
        name: "media"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/tour.md"
        label: "Tour Page"
        name: "tour"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/videos.md"
        label: "Videos Page"
        name: "videos"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/acid.md"
        label: "Acid Page"
        name: "acid"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}

  - name: "data_files"
    label: "Data Files"
    files:
      - file: "src/data/navigation.json"
        label: "Navigation"
        name: "navigation"
        fields:
          - label: "Navigation Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Link", name: "link", widget: "string"}
      - file: "src/data/socials.json"
        label: "Socials"
        name: "socials"
        fields:
          - label: "Social Links"
            name: "items"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - {label: "CSS Class", name: "class", widget: "string"}
      - file: "src/data/gigs.json"
        label: "Gigs"
        name: "gigs"
        fields:
          - label: "Gigs List"
            name: "items"
            widget: "list"
            fields:
              - {label: "Status (current/legacy)", name: "status", widget: "string"}
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Venue", name: "venue", widget: "string"}
              - {label: "Location", name: "location", widget: "string"}
              - {label: "Maps URL", name: "maps_url", widget: "string", required: false}
      - file: "src/data/videos.json"
        label: "Videos"
        name: "videos"
        fields:
          - label: "Videos List"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "YouTube ID", name: "youtube_id", widget: "string", required: false}
              - {label: "Facebook URL", name: "facebook_url", widget: "string", required: false}
              - {label: "Wix Video URL", name: "wix_video_url", widget: "string", required: false}
      - file: "src/data/exposition.json"
        label: "Exposition"
        name: "exposition"
        fields:
          - label: "Exposition Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Type", name: "type", widget: "select", options: ["hero", "row", "quote", "cta"]}
              - {label: "Text", name: "text", widget: "text", required: false}
              - {label: "Subtext", name: "subtext", widget: "string", required: false}
              - {label: "Image", name: "image", widget: "image", required: false}
              - {label: "Alt Text", name: "alt", widget: "string", required: false}
              - {label: "Reverse Layout", name: "reverse", widget: "boolean", required: false}
      - file: "src/data/gallery_highlights.json"
        label: "Gallery Highlights"
        name: "gallery_highlights"
        fields:
          - label: "Images"
            name: "items"
            widget: "list"
            field: {label: "Image Name", name: "image", widget: "string"}
      - file: "src/data/gallery_archive.json"
        label: "Gallery Archive"
        name: "gallery_archive"
        fields:
          - label: "Images"
            name: "items"
            widget: "list"
            field: {label: "Image Name", name: "image", widget: "string"}
