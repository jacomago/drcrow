backend:
  name: git-gateway
  branch: master # or master, depending on your repo

media_folder: "public/assets/images" # Folder where media files will be stored
public_folder: "/assets/images" # The src attribute for uploaded media will begin with this path

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/pages/about.md"
        label: "About Page"
        name: "about"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/contact.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/exposition.md"
        label: "Exposition Page"
        name: "exposition"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/gallery.md"
        label: "Gallery Page"
        name: "gallery"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/index.md"
        label: "Home Page"
        name: "index"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "../layouts/Home.astro"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Tagline", name: "hero_tagline", widget: "string"}
          - {label: "Hero CTA Link", name: "hero_cta_link", widget: "string"}
          - {label: "Hero CTA Text", name: "hero_cta_text", widget: "string"}
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/media.md"
        label: "Media Page"
        name: "media"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/tour.md"
        label: "Tour Page"
        name: "tour"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/videos.md"
        label: "Videos Page"
        name: "videos"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      - file: "src/pages/acid.md"
        label: "Acid Page"
        name: "acid"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
