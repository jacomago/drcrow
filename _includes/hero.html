<div class="hero-section">
  <div class="hero-overlay">
    <p class="hero-tagline">{{ include.tagline | default: ". . . . stray from the path" }}</p>
    <img src="{{ 'illustrations/header.png' | relative_url }}" alt="{{ include.title | default: page.title }}" class="headline-logo" loading="eager" decoding="async">
    {% if include.cta_link %}
    <br>
    <a href="{{ include.cta_link | relative_url }}" class="hero-cta">
      {{ include.cta_text | default: "LISTEN NOW" }}
    </a>
    {% endif %}
  </div>
  <div class="hero-image">
    <img src="{{ include.image | default: 'assets/images/home-hero.jpg' | relative_url }}" alt="{{ include.title }}" loading="eager" decoding="async">
  </div>
</div>
