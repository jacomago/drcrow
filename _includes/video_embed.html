<div class="video-container">
  {% if include.facebook_url %}
  <iframe src="https://www.facebook.com/plugins/video.php?href={{ include.facebook_url | url_encode }}&show_text=0&width=560" width="100%" height="450" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowTransparency="true" allowFullScreen="true"></iframe>
  {% elsif include.wix_video_url %}
  <video autoplay loop muted playsinline style="width: 100%; height: auto; border: 2px solid #4b0082;">
    <source src="{{ include.wix_video_url }}" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  {% endif %}
</div>
