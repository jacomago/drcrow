<div class="page-hero">
  <div class="hero-overlay">
    <h1>{{ include.title | default: page.title }}</h1>
    {% if include.tagline %}
    <p class="hero-tagline">{{ include.tagline }}</p>
    {% endif %}
  </div>
  {% if include.image %}
  <div class="hero-image">
    <img src="{{ include.image | relative_url }}" alt="{{ include.title }}" loading="lazy" decoding="async">
  </div>
  {% endif %}
</div>
