<div class="event-item">
  <div class="event-date">{{ include.date }}</div>
  <div class="event-details">
    <h3 class="event-venue">{{ include.venue }}</h3>
    <p class="event-location">{{ include.location }}</p>
    {% if include.maps_url %}
    <a href="{{ include.maps_url }}" class="portal-link" target="_blank">LOCATE VIA PORTAL (MAPS)</a>
    {% endif %}
  </div>
</div>
